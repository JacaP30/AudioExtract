name: Build AudioExtract

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AudioExtract-windows
          - os: macos-latest
            artifact: AudioExtract-macos
          # ubuntu-22.04 = glibc 2.35 — działa też na nowszych Linuxach.
          # ubuntu-latest (24.04) wymaga glibc 2.38+ i pada na Ubuntu 22.04 / Debian 12.
          - os: ubuntu-22.04
            artifact: AudioExtract-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console --name AudioExtract
          --add-data "templates${{ runner.os == 'Windows' && ';' || ':' }}templates"
          --add-data "static${{ runner.os == 'Windows' && ';' || ':' }}static"
          --add-data "licenses${{ runner.os == 'Windows' && ';' || ':' }}licenses"
          --add-data "LICENSE${{ runner.os == 'Windows' && ';' || ':' }}."
          --collect-all imageio_ffmpeg app.py

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/AudioExtract.exe release/AudioExtract.exe
          Compress-Archive -Path release/AudioExtract.exe -DestinationPath release/AudioExtract-windows.zip -Force

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: python3 scripts/package-macos.py

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          python3 scripts/package-linux.py
          (cd release && zip -9 AudioExtract-linux.zip AudioExtract CZYTAJ.txt)

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/AudioExtract.exe
            release/AudioExtract.app
            release/AudioExtract
            release/CZYTAJ.txt
