name: Build Audioyt

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Audioyt-windows
          - os: macos-latest
            artifact: Audioyt-macos
          - os: ubuntu-latest
            artifact: Audioyt-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console --name Audioyt
          --add-data "templates${{ runner.os == 'Windows' && ';' || ':' }}templates"
          --add-data "static${{ runner.os == 'Windows' && ';' || ':' }}static"
          --collect-all imageio_ffmpeg app.py

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Audioyt.exe release/Audioyt.exe

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: python3 scripts/package-macos.py

      - name: Package Linux launcher
        if: runner.os == 'Linux'
        run: python3 scripts/package-linux.py

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/
